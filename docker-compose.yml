services:
  # Full stack — single process for simple deployments
  app:
    build: .
    platform: linux/amd64
    container_name: jobs_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # API-only — for scaling API independently
  api:
    build: .
    platform: linux/amd64
    container_name: jobs_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    profiles:
      - api-only

  # Worker-only (one-shot ingestion)
  worker:
    build: .
    platform: linux/amd64
    container_name: jobs_worker
    command: python -m src.main --ingest-once
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    restart: "no"
    volumes:
      - ./logs:/app/logs
    profiles:
      - worker-only
